<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn — Repend</title>
  <meta name="description" content="Type any concept. AI builds an immersive 3D interactive lab from scratch, then checks that you actually understood it." />
  <meta property="og:title" content="Repend — Learn by doing." />
  <meta property="og:description" content="Rep up. End with clarity. Immersive 3D learning labs." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/repend.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.65;
      overflow-x: hidden;
    }

    .ui-layer { position: relative; z-index: 1; }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 36px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 12, 20, 0.8);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; text-decoration: none; color: var(--text); }
    .logo em { font-style: normal; color: var(--mars); }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 72px 24px 56px;
      max-width: 820px;
      margin: 0 auto;
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--ice);
      background: rgba(76, 201, 240, 0.08);
      border: 1px solid rgba(76, 201, 240, 0.25);
      border-radius: 24px;
      padding: 7px 16px;
      margin-bottom: 28px;
      backdrop-filter: blur(8px);
    }
    .hero-eyebrow::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--mars);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--mars);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .hero h1 {
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -2.5px;
      line-height: 1.02;
      margin-bottom: 22px;
    }
    .hero h1 .line1 {
      color: var(--text);
      text-shadow: 0 4px 40px rgba(0,0,0,0.5);
    }
    .hero h1 .line2 {
      background: linear-gradient(135deg, var(--mars), var(--ice));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto 40px;
      line-height: 1.75;
    }

    .glass-panel {
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: var(--r);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      padding: 8px 8px 8px 22px;
      max-width: 640px;
      margin: 0 auto;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .input-wrap:focus-within {
      border-color: var(--mars);
      box-shadow: 0 0 0 2px rgba(232,93,4,0.15), 0 12px 48px rgba(232,93,4,0.12);
    }
    #topicInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
      padding: 12px 0;
      font-family: inherit;
    }
    #topicInput::placeholder { color: var(--muted); }
    #genBtn {
      background: linear-gradient(135deg, var(--mars), var(--dust));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px 30px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      white-space: nowrap;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(232, 93, 4, 0.25);
    }
    #genBtn:hover { box-shadow: 0 6px 28px rgba(232, 93, 4, 0.35); transform: translateY(-1px); }
    #genBtn:active { transform: scale(0.97); }
    #genBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 22px; }
    .chip {
      background: rgba(18,20,32,0.8);
      border: 1px solid rgba(76,201,240,0.15);
      border-radius: 24px;
      padding: 7px 16px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(8px);
    }
    .chip:hover {
      border-color: var(--mars);
      color: var(--mars2);
      box-shadow: 0 0 20px rgba(232,93,4,0.15);
      transform: translateY(-2px);
    }
    .chip-more { border-style: dashed; border-color: rgba(212,165,116,0.3); }

    .cat-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 28px; }
    .cat-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 6px 12px;
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .cat-tab:hover { color: var(--ice); }
    .cat-tab.active { color: var(--mars); border-bottom-color: var(--mars); }

    /* ── LOADING ── */
    #loading {
      display: none;
      text-align: center;
      padding: 64px 24px 72px;
      max-width: 480px;
      margin: 0 auto;
    }
    .loading-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    .loading-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 32px;
      font-family: "JetBrains Mono", monospace;
    }
    .pulse-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(232,93,4,0.1);
      border-top-color: var(--mars);
      border-right-color: var(--ice);
      animation: spin 1s linear infinite;
      margin: 0 auto 28px;
      box-shadow: 0 0 40px rgba(232,93,4,0.2);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #expandedTopic {
      display: none;
      max-width: 420px;
      margin: 0 auto 24px;
      padding: 16px 20px;
      text-align: left;
      border-color: rgba(212,165,116,0.3);
    }
    #expandedTopic .et-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--copper);
      margin-bottom: 6px;
    }
    #expandedTopic .et-topic { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    #expandedTopic .et-why { font-size: 0.8rem; color: var(--muted); line-height: 1.5; }

    .stages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
      margin: 0 auto;
      padding: 16px;
    }
    .stage-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 12px;
      background: rgba(12,14,24,0.6);
      border: 1px solid rgba(76,201,240,0.08);
      opacity: 0.3;
      transition: all 0.35s;
    }
    .stage-row.active {
      opacity: 1;
      border-color: var(--mars);
      box-shadow: 0 0 24px rgba(232,93,4,0.12);
      transform: translateX(6px);
    }
    .stage-row.done { opacity: 0.7; border-color: var(--green); }
    .stage-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .stage-row.active .stage-dot {
      background: var(--mars);
      box-shadow: 0 0 10px var(--mars);
    }
    .stage-row.done .stage-dot { background: var(--green); }
    .stage-text { font-size: 0.84rem; color: var(--muted); text-align: left; }
    .stage-row.active .stage-text { color: var(--text); }
    .stage-row.done .stage-text { color: var(--green); }

    #cancelBtn {
      margin-top: 24px;
      background: transparent;
      border: 1px solid rgba(139,155,181,0.25);
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    #cancelBtn:hover { border-color: rgba(239,68,68,0.5); color: #FCA5A5; }

    /* ── ERROR ── */
    #errorBox {
      display: none;
      max-width: 620px;
      margin: 32px auto;
      padding: 22px 26px;
      border-color: rgba(239,68,68,0.35);
      color: #FCA5A5;
      font-size: 0.9rem;
    }
    #errorBox .error-title { font-weight: 700; margin-bottom: 6px; color: #FECACA; }
    .error-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-retry {
      background: linear-gradient(135deg, var(--mars), var(--dust));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-dismiss {
      background: transparent;
      border: 1px solid rgba(239,68,68,0.3);
      color: #FCA5A5;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 0.88rem;
      cursor: pointer;
      font-family: inherit;
    }

    /* ── EXPERIENCE ── */
    #experience {
      display: none;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .step-num {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(232,93,4,0.12);
      border: 1.5px solid var(--mars);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--mars);
      box-shadow: 0 0 20px rgba(232,93,4,0.2);
    }
    .step-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      color: var(--ice);
      font-family: "JetBrains Mono", monospace;
    }
    .step-title { font-size: 1.1rem; font-weight: 700; }

    #stepScenario { margin-bottom: 48px; }
    .scenario-card {
      padding: 36px 40px;
      position: relative;
      overflow: hidden;
    }
    .scenario-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--mars), var(--ice), var(--copper));
    }
    #scenarioText {
      font-size: 1rem;
      line-height: 1.85;
      color: #D4DCE8;
      white-space: pre-line;
    }

    .goal-pill {
      display: none;
      align-items: flex-start;
      gap: 8px;
      margin-top: 20px;
      font-size: 0.83rem;
      background: rgba(76,201,240,0.06);
      border: 1px solid rgba(76,201,240,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      line-height: 1.5;
    }
    .goal-pill.visible { display: inline-flex; }
    .goal-pill::before { content: '◎'; color: var(--ice); flex-shrink: 0; }

    #stepSim { margin-bottom: 48px; }
    .sim-frame-wrap {
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      background: var(--bg0);
    }
    #simFrame {
      width: 100%;
      height: min(78vh, 720px);
      min-height: 480px;
      border: none;
      display: block;
      background: var(--void);
    }

    #stepVerify { margin-bottom: 40px; }
    .verify-card { padding: 32px 36px; }
    #questionText {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-option {
      background: rgba(18,20,32,0.9);
      border: 1.5px solid rgba(76,201,240,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      font-family: inherit;
    }
    .quiz-option:hover:not(:disabled) {
      border-color: var(--mars);
      background: rgba(232,93,4,0.06);
      transform: translateX(4px);
    }
    .quiz-option.correct-pick { border-color: var(--green); background: rgba(34,197,94,0.08); color: #6EE7B7; }
    .quiz-option.wrong-pick { border-color: rgba(239,68,68,0.5); background: rgba(239,68,68,0.06); color: #FCA5A5; }
    .quiz-option.reveal-correct { border-color: var(--green); opacity: 0.75; color: #6EE7B7; }
    .quiz-option:disabled { cursor: default; }

    #answerInput {
      width: 100%;
      background: rgba(18,20,32,0.9);
      border: 1.5px solid rgba(76,201,240,0.15);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 0.95rem;
      resize: vertical;
      min-height: 90px;
      outline: none;
      font-family: inherit;
      line-height: 1.6;
    }
    #answerInput:focus { border-color: var(--mars); box-shadow: 0 0 0 2px rgba(232,93,4,0.12); }
    #checkBtn {
      margin-top: 14px;
      background: linear-gradient(135deg, var(--mars), var(--dust));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 32px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(232,93,4,0.25);
    }
    #checkBtn:disabled { opacity: 0.45; cursor: not-allowed; }

    #feedback {
      display: none;
      margin-top: 20px;
      padding: 18px 22px;
      border-radius: 12px;
      font-size: 0.93rem;
      line-height: 1.7;
    }
    #feedback.correct { background: rgba(52,211,153,0.07); border: 1px solid rgba(52,211,153,0.25); color: #6EE7B7; }
    #feedback.wrong { background: rgba(251,191,36,0.07); border: 1px solid rgba(251,191,36,0.2); color: #FDE68A; }
    .feedback-prefix { font-weight: 700; margin-bottom: 6px; font-size: 0.78rem; letter-spacing: 0.8px; text-transform: uppercase; }

    #payoffCard {
      display: none;
      margin-top: 20px;
      padding: 18px 22px;
      border-radius: 12px;
      background: rgba(34,197,94,0.06);
      border: 1px solid rgba(34,197,94,0.2);
      color: #6EE7B7;
      line-height: 1.7;
    }
    #payoffCard .payoff-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 6px;
    }

    #againBtn {
      display: none;
      margin-top: 24px;
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    #againBtn:hover { border-color: var(--mars); color: var(--mars2); }

    .step-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 0 0 36px;
    }
    .step-divider::before, .step-divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }
    .step-divider span {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-family: "JetBrains Mono", monospace;
    }

    #topicBadge {
      display: none;
      text-align: center;
      padding: 36px 24px 0;
    }
    #topicBadge .badge-inner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      font-size: 0.85rem;
      color: var(--copper);
      font-weight: 600;
    }
    .badge-cached {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--green);
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.25);
      border-radius: 12px;
      padding: 2px 8px;
    }

    footer {
      text-align: center;
      padding: 48px 24px 56px;
      border-top: 1px solid var(--border);
    }
    footer .footer-logo { font-size: 1rem; font-weight: 800; margin-bottom: 8px; }
    footer .footer-logo em { font-style: normal; color: var(--mars); }
    footer p { font-size: 0.82rem; color: var(--muted); }
    footer .footer-tag { color: var(--copper); font-weight: 600; margin-top: 4px; }

    .nav-links { display: flex; align-items: center; gap: 18px; }
    .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-xp-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.72rem;
    }
    .nav-lvl { color: var(--mars); font-weight: 700; min-width: 36px; }
    .nav-xp-track {
      width: 80px; height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .nav-xp-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--mars), var(--ice));
      border-radius: 3px;
      transition: width 0.5s;
    }
    .nav-xp-num { color: var(--muted); min-width: 48px; }
    .nav-streak { font-size: 0.72rem; color: var(--mars); font-weight: 700; }

    /* ── LEARN DASHBOARD (Khan / BYJU's style) ── */
    .learn-dashboard {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 24px 0;
    }
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .dash-card {
      padding: 18px 20px;
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .dash-card:hover { transform: translateY(-2px); border-color: rgba(232,93,4,0.35); }
    .dash-card .dash-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--ice);
      margin-bottom: 8px;
    }
    .dash-card .dash-title { font-size: 0.95rem; font-weight: 700; line-height: 1.35; margin-bottom: 4px; }
    .dash-card .dash-meta { font-size: 0.78rem; color: var(--muted); }
    .dash-card.daily { border-color: rgba(232,93,4,0.3); background: rgba(232,93,4,0.06); }
    .dash-card.continue { border-color: rgba(76,201,240,0.25); }
    .weekly-bar-wrap { margin-bottom: 20px; padding: 16px 20px; }
    .weekly-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.82rem; }
    .weekly-header strong { color: var(--mars); font-family: "JetBrains Mono", monospace; }
    .weekly-track { height: 8px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
    .weekly-fill { height: 100%; background: linear-gradient(90deg, var(--mars), var(--ice)); border-radius: 4px; transition: width 0.5s; }
    .mastery-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .mastery-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 24px;
      font-size: 0.75rem;
      background: rgba(18,20,32,0.8);
      border: 1px solid var(--border);
    }
    .mastery-ring {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: conic-gradient(var(--mars) var(--pct), rgba(255,255,255,0.08) 0);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .mastery-ring span {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--bg0);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
    }
    .section-block { max-width: 820px; margin: 0 auto; padding: 0 24px 16px; }
    .section-block h3 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .search-wrap {
      max-width: 640px;
      margin: 0 auto 16px;
      padding: 0 24px;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(18,20,32,0.6);
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--ice); }

    /* ── YOUR LABS LIBRARY ── */
    .my-labs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .lab-card { position: relative; padding: 14px 16px; text-align: left; cursor: pointer; transition: transform 0.15s, border-color 0.15s; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .lab-card:hover { transform: translateY(-2px); border-color: rgba(232,93,4,0.4); }
    .lab-card-main { min-width: 0; flex: 1; }
    .lab-card-title { font-size: 0.9rem; font-weight: 700; line-height: 1.3; margin-bottom: 4px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lab-card-meta { font-size: 0.72rem; color: var(--muted); }
    .lab-card-meta .saved-cached { color: var(--green); font-weight: 700; }
    .lab-card-menu-btn { background: transparent; border: none; color: var(--muted); font-size: 1.1rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; font-family: inherit; }
    .lab-card-menu-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .lab-card-menu { display: none; position: absolute; top: 38px; right: 12px; background: rgba(12,14,24,0.98); border: 1px solid var(--border); border-radius: 10px; min-width: 140px; padding: 6px; z-index: 50; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .lab-card-menu.open { display: block; }
    .lab-card-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--muted); font-size: 0.82rem; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-family: inherit; }
    .lab-card-menu button:hover { background: rgba(232,93,4,0.1); color: var(--text); }
    .lab-card-menu button.danger:hover { background: rgba(239,68,68,0.12); color: #FCA5A5; }
    .lab-rename-input { width: 100%; background: rgba(18,20,32,0.95); border: 1.5px solid var(--mars); border-radius: 8px; padding: 6px 8px; color: var(--text); font-size: 0.88rem; font-family: inherit; outline: none; }
    .chip.done-topic { opacity: 0.55; border-style: dashed; }
    .chip.done-topic::after { content: ' ✓'; color: var(--green); }
    .next-steps {
      display: none;
      margin-top: 20px;
      padding: 20px 22px;
      border-color: rgba(76,201,240,0.2);
    }
    .next-steps.visible { display: block; }
    .next-steps h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; color: var(--ice); }
    .next-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .next-btn {
      background: rgba(232,93,4,0.1);
      border: 1px solid rgba(232,93,4,0.3);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .next-btn:hover { background: rgba(232,93,4,0.18); transform: translateY(-1px); }
    .next-btn.secondary { border-color: rgba(76,201,240,0.25); background: rgba(76,201,240,0.06); }
    .bookmark-btn {
      float: right;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      font-family: inherit;
    }
    .bookmark-btn.active { color: var(--mars); border-color: rgba(232,93,4,0.4); }

    @media (max-width: 640px) {
      nav { padding: 14px 18px; flex-wrap: wrap; gap: 8px; }
      .nav-tag { display: none; }
      .nav-links { width: 100%; justify-content: center; flex-wrap: wrap; }
      .nav-xp-track { width: 60px; }
      .hero { padding: 48px 18px 40px; }
      .scenario-card, .verify-card { padding: 22px !important; }
      #simFrame { min-height: 380px; height: 65vh; }
      .input-wrap { flex-direction: column; padding: 12px; }
      #genBtn { width: 100%; }
    }

    /* ── AUTH ── */
    .nav-auth { display: flex; align-items: center; gap: 8px; }
    .btn-login { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: var(--text); border-radius: 10px; padding: 7px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s; font-family: inherit; }
    .btn-login:hover { border-color: var(--mars); color: var(--mars); }
    .btn-signup { background: var(--mars); border: none; color: #fff; border-radius: 10px; padding: 7px 14px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-signup:hover { background: var(--mars2); }
    .auth-avatar { display: none; align-items: center; }
    .avatar-circle { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--mars), var(--ice)); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: #fff; cursor: pointer; position: relative; }
    .avatar-menu { display: none; position: absolute; top: calc(100% + 8px); right: 0; background: rgba(12,14,24,0.98); border: 1px solid var(--border); border-radius: 12px; min-width: 180px; padding: 8px; z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .avatar-circle:hover .avatar-menu, .avatar-circle.open .avatar-menu { display: block; }
    .avatar-name { font-size: 0.8rem; font-weight: 700; color: var(--text); padding: 8px 10px 4px; }
    .avatar-email { font-size: 0.72rem; color: var(--muted); padding: 0 10px 8px; border-bottom: 1px solid var(--border); }
    .avatar-menu-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--muted); font-size: 0.83rem; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-family: inherit; }
    .avatar-menu-item:hover { background: rgba(232,93,4,0.1); color: var(--text); }
    .avatar-menu-item.danger:hover { background: rgba(239,68,68,0.1); color: #FCA5A5; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 500; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: rgba(12,14,24,0.98); border: 1px solid var(--border); border-radius: 20px; padding: 40px 44px; width: 100%; max-width: 420px; position: relative; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
    .modal-close { position: absolute; top: 16px; right: 18px; background: none; border: none; color: var(--muted); font-size: 1.3rem; cursor: pointer; }
    .modal-close:hover { color: var(--text); }
    .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; color: var(--text); }
    .modal-sub { font-size: 0.85rem; color: var(--muted); margin-bottom: 28px; }
    .modal-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .modal-tab { flex: 1; background: none; border: none; padding: 10px; font-size: 0.88rem; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit; }
    .modal-tab.active { color: var(--mars); border-bottom-color: var(--mars); }
    .auth-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .auth-field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; }
    .auth-field input { background: rgba(18,20,32,0.9); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; }
    .auth-field input:focus { border-color: var(--mars); }
    .btn-auth-submit { width: 100%; background: var(--mars); border: none; color: #fff; border-radius: 12px; padding: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 4px; font-family: inherit; }
    .btn-auth-submit:hover { background: var(--mars2); }
    .btn-auth-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-google { width: 100%; background: rgba(18,20,32,0.9); border: 1.5px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; font-family: inherit; }
    .btn-google:hover { border-color: var(--mars); }
    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-size: 0.78rem; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .auth-msg { font-size: 0.82rem; text-align: center; margin-top: 12px; min-height: 20px; }
    .auth-msg.error { color: #FCA5A5; }
    .auth-msg.success { color: #6EE7B7; }

    /* ── SIDEBAR LAYOUT ── */
    body { display: flex; }
    .sidebar {
      width: 220px; min-width: 220px;
      height: 100vh;
      position: fixed; left: 0; top: 0;
      background: rgba(8,9,16,0.97);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 200;
      padding: 20px 0;
      backdrop-filter: blur(16px);
    }
    .sidebar-logo {
      display: flex; align-items: center; gap: 10px;
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .sidebar-logo svg { flex-shrink: 0; }
    .sidebar-logo-text { font-size: 1.1rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text); }
    .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 12px; border-radius: 10px;
      font-size: 0.88rem; font-weight: 600;
      color: var(--muted); cursor: pointer;
      text-decoration: none; border: none; background: none;
      font-family: inherit; transition: all 0.15s;
      width: 100%; text-align: left;
    }
    .sidebar-item:hover { background: rgba(232,93,4,0.08); color: var(--text); }
    .sidebar-item.active { background: rgba(232,93,4,0.12); color: var(--mars); }
    .sidebar-item-icon { width: 18px; text-align: center; font-size: 1rem; flex-shrink: 0; }
    .sidebar-xp {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .sidebar-auth {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .sidebar-auth .btn-login, .sidebar-auth .btn-signup { width: 100%; text-align: center; border-radius: 10px; padding: 9px 12px; font-size: 0.84rem; }
    .sidebar-profile {
      display: none; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 10px;
      cursor: pointer;
    }
    .sidebar-profile.visible { display: flex; }
    .sidebar-profile:hover { background: rgba(255,255,255,0.05); }
    .sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--mars), var(--ice)); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; color: #fff; flex-shrink: 0; }
    .sidebar-profile-info { min-width: 0; }
    .sidebar-profile-name { font-size: 0.82rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-profile-email { font-size: 0.68rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-signout { margin-top: 2px; background: none; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; font-family: inherit; text-align: left; padding: 2px 0; }
    .sidebar-signout:hover { color: #FCA5A5; }

    /* Main content shifts right of sidebar */
    .ui-layer { margin-left: 220px; width: calc(100% - 220px); }
    nav { display: none; } /* hide old top nav */

    /* Share button */
    .share-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .share-btn:hover { border-color: var(--ice); color: var(--ice); }
    .share-toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: rgba(12,14,24,0.95); border: 1px solid var(--green); color: #6EE7B7; border-radius: 10px; padding: 10px 22px; font-size: 0.85rem; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
    .share-toast.show { opacity: 1; }

    /* Level modal */
    .level-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 600; align-items: center; justify-content: center; }
    .level-modal.open { display: flex; }
    .level-card { background: rgba(12,14,24,0.98); border: 1px solid var(--border); border-radius: 20px; padding: 36px 40px; width: 100%; max-width: 480px; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
    .level-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; }
    .level-topic { color: var(--mars); }
    .level-sub { font-size: 0.84rem; color: var(--muted); margin-bottom: 28px; }
    .level-q { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; color: var(--text); }
    .level-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    .level-opt { background: rgba(18,20,32,0.9); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 0.88rem; color: var(--muted); cursor: pointer; text-align: left; font-family: inherit; transition: all 0.15s; }
    .level-opt:hover { border-color: var(--mars); color: var(--text); }
    .level-opt.selected { border-color: var(--mars); background: rgba(232,93,4,0.1); color: var(--text); }
    .level-go { width: 100%; background: var(--mars); border: none; color: #fff; border-radius: 12px; padding: 13px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 4px; font-family: inherit; }
    .level-go:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 780px) {
      .sidebar { width: 60px; min-width: 60px; }
      .sidebar-logo-text, .sidebar-item span:not(.sidebar-item-icon), .sidebar-profile-info, .sidebar-xp, .sidebar-auth .btn-login, .sidebar-auth .btn-signup { display: none; }
      .sidebar-logo { padding: 0 10px 20px; justify-content: center; }
      .sidebar-item { justify-content: center; padding: 11px; }
      .sidebar-auth { padding: 8px 6px; }
      .sidebar-avatar { margin: 0 auto; }
      .sidebar-profile { padding: 8px 6px; justify-content: center; }
      .ui-layer { margin-left: 60px; width: calc(100% - 60px); }
    }
</head>

<div class="level-modal" id="levelModal">

<script src="/repend-game.js"></script>

<script>
  const TOPIC_CATALOG = typeof RependGame !== "undefined" ? RependGame.TOPIC_CATALOG : {
    "Physics": ["Newton's Second Law", "Orbital Mechanics", "Wave Interference"],
    "Biology": ["Natural Selection", "DNA Replication", "Photosynthesis"],
    "Money & Econ": ["Compound Interest", "Supply and Demand", "Inflation"],
    "Math & Data": ["Central Limit Theorem", "Bayes' Theorem", "Linear Regression"],
    "Sports & Skills": ["Basketball Free-Throw Arc", "Golf Swing Plane", "Tennis Topspin"],
    "Everyday Science": ["Why Planes Fly", "How GPS Works", "Why the Sky Is Blue"],
  };

  let labFlags = { isDaily: false, isReview: false };
  let chipFilter = "";

  // ── LAB LIBRARY ──────────────────────────────────────────────────
  // Persists every generated lab (full HTML included) to localStorage so
  // the learner can reopen it instantly — zero regeneration, zero API cost.
  const LabLibrary = {
    KEY: "repend_labs_v1",
    MAX: 40,
    all() { try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch (_) { return []; } },
    _write(labs) { try { localStorage.setItem(this.KEY, JSON.stringify(labs)); } catch (_) {} },
    save(plan, category) {
      if (!plan || !plan.topicKey || !plan.labHtml) return;
      let labs = this.all();
      const i = labs.findIndex(l => l.topicKey === plan.topicKey);
      const title = (i >= 0 && labs[i].title) ? labs[i].title : plan.topic;
      const entry = { topicKey: plan.topicKey, topic: plan.topic, title, category: category || "General", result: plan, savedAt: Date.now() };
      if (i >= 0) labs.splice(i, 1);
      labs.unshift(entry);
      if (labs.length > this.MAX) labs = labs.slice(0, this.MAX);
      this._write(labs);
    },
    get(key) { return this.all().find(l => l.topicKey === key) || null; },
    rename(key, title) { const labs = this.all(); const l = labs.find(x => x.topicKey === key); if (l) { l.title = title; this._write(labs); } },
    remove(key) { this._write(this.all().filter(l => l.topicKey !== key)); },
  };

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return "just now";
    const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
    const d = Math.floor(h / 24); return d + "d ago";
  }

  function renderMyLabs() {
    const sec = document.getElementById("myLabsSection");
    const grid = document.getElementById("myLabsGrid");
    if (!sec || !grid) return;
    const labs = LabLibrary.all();
    if (!labs.length) { sec.style.display = "none"; return; }
    sec.style.display = "block";
    grid.innerHTML = "";
    labs.forEach(lab => {
      const card = document.createElement("div");
      card.className = "lab-card glass-panel";
      card.innerHTML = `
        <div class="lab-card-main">
          <div class="lab-card-title" title="${lab.title.replace(/"/g, "&quot;")}">${lab.title}</div>
          <div class="lab-card-meta">${lab.category} · <span class="saved-cached">saved</span> · ${timeAgo(lab.savedAt)}</div>
        </div>
        <button class="lab-card-menu-btn" aria-label="Options">⋯</button>
        <div class="lab-card-menu">
          <button data-act="open">Open</button>
          <button data-act="rename">Rename</button>
          <button data-act="delete" class="danger">Delete</button>
        </div>`;
      const menu = card.querySelector(".lab-card-menu");
      const menuBtn = card.querySelector(".lab-card-menu-btn");
      const titleEl = card.querySelector(".lab-card-title");

      card.querySelector(".lab-card-main").onclick = () => openSavedLab(lab.topicKey);
      menuBtn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll(".lab-card-menu.open").forEach(m => { if (m !== menu) m.classList.remove("open"); });
        menu.classList.toggle("open");
      };
      menu.querySelector('[data-act="open"]').onclick = (e) => { e.stopPropagation(); menu.classList.remove("open"); openSavedLab(lab.topicKey); };
      menu.querySelector('[data-act="delete"]').onclick = (e) => {
        e.stopPropagation(); menu.classList.remove("open");
        LabLibrary.remove(lab.topicKey);
        renderMyLabs();
        if (typeof RependGame !== "undefined") RependGame.showToast("Lab deleted");
      };
      menu.querySelector('[data-act="rename"]').onclick = (e) => {
        e.stopPropagation(); menu.classList.remove("open");
        const input = document.createElement("input");
        input.className = "lab-rename-input";
        input.value = lab.title;
        titleEl.replaceWith(input);
        input.focus(); input.select();
        const commit = () => {
          const v = input.value.trim() || lab.topic;
          LabLibrary.rename(lab.topicKey, v);
          renderMyLabs();
        };
        input.onkeydown = (ev) => { if (ev.key === "Enter") commit(); if (ev.key === "Escape") renderMyLabs(); };
        input.onblur = commit;
      };
      grid.appendChild(card);
    });
  }

  function openSavedLab(key) {
    const lab = LabLibrary.get(key);
    if (!lab) return;
    lastCategory = lab.category;
    window._rependCat = lab.category;
    labFlags = { isDaily: false, isReview: false };
    labRewarded = false;
    lastTopic = lab.topic;
    heroSection.style.display = "none";
    document.getElementById("learnDashboard").style.display = "none";
    errorBox.style.display = "none";
    loadingEl.style.display = "none";
    showResult({ ...lab.result, source: "cached" });
  }

  document.addEventListener("click", () => {
    document.querySelectorAll(".lab-card-menu.open").forEach(m => m.classList.remove("open"));
  });

  function renderDashboard() {
    if (typeof RependGame === "undefined") return;
    const s = RependGame.exportState();
    const dash = document.getElementById("learnDashboard");
    dash.style.display = "block";

    const cards = [];
    const daily = s.dailyChallenge;
    const dailyDone = RependGame.isTopicDone(daily.topic);
    cards.push(`
      <div class="dash-card glass-panel daily" data-topic="${daily.topic}" data-cat="${daily.category}" data-daily="1">
        <div class="dash-label">🎯 Lab of the day ${dailyDone ? "· done" : "· +25 XP"}</div>
        <div class="dash-title">${daily.topic}</div>
        <div class="dash-meta">${daily.category}</div>
      </div>`);

    if (s.lastSession) {
      cards.push(`
        <div class="dash-card glass-panel continue" data-topic="${s.lastSession.topic}" data-cat="${s.lastSession.category}">
          <div class="dash-label">▶ Continue learning</div>
          <div class="dash-title">${s.lastSession.topic}</div>
          <div class="dash-meta">Pick up where you left off</div>
        </div>`);
    }

    if (s.dueReviews.length) {
      const r = s.dueReviews[0];
      cards.push(`
        <div class="dash-card glass-panel" data-topic="${r.topic}" data-cat="${r.category}" data-review="1">
          <div class="dash-label">🧠 Review due · +40 XP</div>
          <div class="dash-title">${r.topic}</div>
          <div class="dash-meta">Spaced repetition boost</div>
        </div>`);
    }

    document.getElementById("dashCards").innerHTML = cards.join("");
    document.querySelectorAll(".dash-card").forEach(el => {
      el.onclick = () => startLab(el.dataset.topic, el.dataset.cat, {
        isDaily: el.dataset.daily === "1",
        isReview: el.dataset.review === "1",
      });
    });

    document.getElementById("weeklyBar").innerHTML = `
      <div class="weekly-header">
        <span>Weekly goal</span>
        <strong>${s.weeklyLabs} / ${s.weeklyGoal} labs</strong>
      </div>
      <div class="weekly-track"><div class="weekly-fill" style="width:${s.weeklyPct}%"></div></div>`;

    document.getElementById("masteryRow").innerHTML = s.mastery.map(m => `
      <div class="mastery-pill" title="${m.label}: ${m.count} labs">
        <div class="mastery-ring" style="--pct:${m.pct}%"><span>${m.icon}</span></div>
        <span>${m.category.split(" ")[0]} · ${m.label}</span>
      </div>`).join("");

    const recSec = document.getElementById("recSection");
    const recEl = document.getElementById("recChips");
    if (s.recommendations.length) {
      recSec.style.display = "block";
      recEl.innerHTML = "";
      s.recommendations.forEach(r => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = r.topic;
        chip.onclick = () => startLab(r.topic, r.category);
        recEl.appendChild(chip);
      });
    } else recSec.style.display = "none";

    const revSec = document.getElementById("reviewSection");
    const revEl = document.getElementById("reviewChips");
    if (s.dueReviews.length) {
      revSec.style.display = "block";
      revEl.innerHTML = "";
      s.dueReviews.slice(0, 5).forEach(r => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = r.topic;
        chip.onclick = () => startLab(r.topic, r.category, { isReview: true });
        revEl.appendChild(chip);
      });
    } else revSec.style.display = "none";
  }

  function startLab(topic, category, flags) {
    labFlags = { isDaily: !!(flags && flags.isDaily), isReview: !!(flags && flags.isReview) };
    lastCategory = category || "General";
    window._rependCat = lastCategory;
    topicInput.value = topic;
    generate();
  }

  function updateBookmarkBtn() {
    const btn = document.getElementById("bookmarkBtn");
    if (!btn || !currentPlan || typeof RependGame === "undefined") return;
    const on = RependGame.isBookmarked(currentPlan.topic);
    btn.classList.toggle("active", on);
    btn.textContent = on ? "★ Saved" : "☆ Save";
  }

  function showNextSteps(recommendations) {
    const el = document.getElementById("nextSteps");
    const btns = document.getElementById("nextBtns");
    if (!recommendations || !recommendations.length) { el.classList.remove("visible"); return; }
    btns.innerHTML = recommendations.map(r =>
      `<button type="button" class="next-btn" data-topic="${r.topic}" data-cat="${r.category}">${r.topic}</button>`
    ).join("") + `<button type="button" class="next-btn secondary" onclick="reset()">Browse catalog</button>`;
    btns.querySelectorAll(".next-btn[data-topic]").forEach(b => {
      b.onclick = () => startLab(b.dataset.topic, b.dataset.cat);
    });
    el.classList.add("visible");
  }

  (function initTopicBrowser() {
    const tabsEl = document.getElementById('catTabs');
    const chipsEl = document.getElementById('topicChips');
    const cats = Object.keys(TOPIC_CATALOG);
    let active = cats[Math.floor(Math.random() * cats.length)];

    function sample(arr, n) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    function renderChips() {
      chipsEl.innerHTML = "";
      let topics = TOPIC_CATALOG[active];
      if (chipFilter) {
        const q = chipFilter.toLowerCase();
        topics = topics.filter(t => t.toLowerCase().includes(q));
      }
      if (!topics.length) {
        chipsEl.innerHTML = '<span class="chip chip-more">No matches</span>';
        return;
      }
      sample(topics, Math.min(6, topics.length)).forEach(topic => {
        const chip = document.createElement("span");
        chip.className = "chip" + (typeof RependGame !== "undefined" && RependGame.isTopicDone(topic) ? " done-topic" : "");
        chip.textContent = topic;
        chip.onclick = () => { window._rependCat = active; startLab(topic, active); };
        chipsEl.appendChild(chip);
      });
      const more = document.createElement('span');
      more.className = 'chip chip-more';
      more.textContent = '↻ More';
      more.onclick = renderChips;
      chipsEl.appendChild(more);
    }

    function renderTabs() {
      tabsEl.innerHTML = '';
      cats.forEach(cat => {
        const tab = document.createElement('button');
        tab.className = 'cat-tab' + (cat === active ? ' active' : '');
        tab.textContent = cat;
        tab.onclick = () => { active = cat; window._rependCat = cat; renderTabs(); renderChips(); };
        tabsEl.appendChild(tab);
      });
    }

    renderTabs();
    renderChips();
    window._rependCat = active;

    document.getElementById("topicSearch").addEventListener("input", e => {
      chipFilter = e.target.value.trim();
      renderChips();
    });
  })();

  const topicInput = document.getElementById("topicInput");
  const genBtn = document.getElementById("genBtn");
  const loadingEl = document.getElementById("loading");
  const errorBox = document.getElementById("errorBox");
  const errorMessage = document.getElementById("errorMessage");
  const heroSection = document.getElementById("heroSection");
  const experienceEl = document.getElementById("experience");
  const topicBadge = document.getElementById("topicBadge");
  const topicBadgeText = document.getElementById("topicBadgeText");
  const cachedBadge = document.getElementById("cachedBadge");
  const scenarioText = document.getElementById("scenarioText");
  const goalPill = document.getElementById("goalPill");
  const simFrame = document.getElementById("simFrame");
  const questionText = document.getElementById("questionText");
  const quizOptions = document.getElementById("quizOptions");
  const textVerify = document.getElementById("textVerify");
  const answerInput = document.getElementById("answerInput");
  const checkBtn = document.getElementById("checkBtn");
  const feedbackEl = document.getElementById("feedback");
  const feedbackPrefix = document.getElementById("feedbackPrefix");
  const feedbackText = document.getElementById("feedbackText");
  const payoffCard = document.getElementById("payoffCard");
  const payoffText = document.getElementById("payoffText");
  const againBtn = document.getElementById("againBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const retryBtn = document.getElementById("retryBtn");
  const dismissBtn = document.getElementById("dismissBtn");
  const expandedTopicEl = document.getElementById("expandedTopic");
  const etTopic = document.getElementById("etTopic");
  const etWhy = document.getElementById("etWhy");
  const stageExpand = document.getElementById("stageExpand");
  const stageThink = document.getElementById("stageThink");
  const stageDesign = document.getElementById("stageDesign");
  const stageLabThink = document.getElementById("stageLabThink");
  const stageImage = document.getElementById("stageImage");
  const stageCode = document.getElementById("stageCode");
  const stageThinkText = document.getElementById("stageThinkText");

  let lastCategory = "General";
  let labRewarded = false;

  function onLabComplete(perfect) {
    if (labRewarded || !currentPlan || typeof RependGame === "undefined") return;
    labRewarded = true;
    const result = RependGame.completeLab({
      topic: currentPlan.topic,
      topicKey: currentPlan.topicKey,
      category: lastCategory,
      perfect,
      score: perfect ? 1 : 0.8,
      isDaily: labFlags.isDaily,
      isReview: labFlags.isReview,
    });
    RependGame.handleCompletion(result);
    showNextSteps(result.recommendations);
    renderDashboard();
  }

  document.addEventListener("DOMContentLoaded", () => {
    if (typeof RependGame !== "undefined") {
      RependGame.renderNavXP();
      renderDashboard();
    }
    renderMyLabs();
    document.getElementById("bookmarkBtn").addEventListener("click", () => {
      if (!currentPlan || typeof RependGame === "undefined") return;
      RependGame.toggleBookmark(currentPlan.topic, lastCategory);
      updateBookmarkBtn();
      RependGame.showToast(RependGame.isBookmarked(currentPlan.topic) ? "Saved to bookmarks" : "Removed bookmark");
    });
    const params = new URLSearchParams(location.search);
    const qTopic = params.get("topic");
    const qCat = params.get("cat");
    if (qTopic) {
      window._rependCat = qCat || RependGame.inferCategory(qTopic);
      startLab(qTopic, window._rependCat);
    }
  });

  let currentPlan = null;
  let lastLabResult = null;
  let generateAbort = null;
  let lastTopic = "";

  function setTopic(t) { topicInput.value = t; topicInput.focus(); }

  topicInput.addEventListener("keydown", e => { if (e.key === "Enter") generate(); });
  genBtn.addEventListener("click", generate);
  checkBtn.addEventListener("click", checkAnswerText);
  cancelBtn.addEventListener("click", cancelGenerate);
  retryBtn.addEventListener("click", () => { errorBox.style.display = "none"; if (lastTopic) { topicInput.value = lastTopic; generate(); } });
  dismissBtn.addEventListener("click", () => { errorBox.style.display = "none"; });

  window.addEventListener("message", e => {
    if (e.data && e.data.type === "labCheck") {
      lastLabResult = e.data.result;
      if (e.data.result && e.data.result.ok) onLabComplete(true);
    }
  });

  function cancelGenerate() {
    if (generateAbort) generateAbort.abort();
    loadingEl.style.display = "none";
    heroSection.style.display = "block";
    renderDashboard();
    genBtn.disabled = false;
  }

  function resetStages() {
    [stageExpand, stageThink, stageDesign, stageLabThink, stageImage, stageCode].forEach(el => el.classList.remove("active", "done"));
    stageImage.style.display = "none";
  }

  function setStage(name) {
    const map = { expand: stageExpand, think: stageThink, design: stageDesign, labthink: stageLabThink, image: stageImage, code: stageCode };
    Object.values(map).forEach(el => { if (el) el.classList.remove("active"); });
    if (name === "image") stageImage.style.display = "flex";
    if (map[name]) map[name].classList.add("active");
    const order = ["expand", "think", "design", "labthink", "image", "code"];
    const idx = order.indexOf(name);
    order.slice(0, idx).forEach(s => { if (map[s]) { map[s].classList.remove("active"); map[s].classList.add("done"); } });
  }

  function handleSSEEvent(event) {
    if (event.stage === "expanded") {
      etTopic.textContent = event.data.topic;
      etWhy.textContent = event.data.why || "";
      expandedTopicEl.style.display = "block";
      stageThinkText.textContent = `Reasoning about "${event.data.topic}"…`;
      setStage("expand");
    }
    if (event.stage === "think") setStage("think");
    if (event.stage === "design") setStage("design");
    if (event.stage === "labthink") setStage("labthink");
    if (event.stage === "image") setStage("image");
    if (event.stage === "code") setStage("code");
    if (event.stage === "error") throw new Error(event.msg);
    if (event.stage === "done") return event.data;
    return null;
  }

  async function streamPlanLab(topic, category, signal, levelBackground, levelGoal) {
    const response = await fetch("/plan-lab", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic, category, levelBackground, levelGoal }),
      signal,
    });
    if (!response.ok) {
      const err = await response.json().catch(() => ({ error: "Request failed" }));
      throw new Error(err.error || "Request failed");
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let result = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const event = JSON.parse(line.slice(6));
        const doneData = handleSSEEvent(event);
        if (doneData) result = doneData;
      }
    }
    return result;
  }

  function showResult(result) {
    currentPlan = result;
    topicBadgeText.textContent = result.topic;
    cachedBadge.style.display = result.source === "cached" ? "inline" : "none";
    updateBookmarkBtn();
    scenarioText.textContent = result.scenario;
    if (result.learningGoal) {
      goalPill.textContent = result.learningGoal;
      goalPill.classList.add("visible");
    } else {
      goalPill.classList.remove("visible");
    }
    feedbackEl.style.display = "none";
    feedbackEl.className = "feedback";
    payoffCard.style.display = "none";
    againBtn.style.display = "none";
    document.getElementById("nextSteps").classList.remove("visible");
    if (result.reflection && result.reflection.question && (result.reflection.options || []).length >= 2) {
      questionText.textContent = result.reflection.question;
      quizOptions.style.display = "flex";
      textVerify.style.display = "none";
      renderQuiz(result.reflection);
    } else {
      questionText.textContent = result.verificationQuestion;
      quizOptions.style.display = "none";
      textVerify.style.display = "block";
      answerInput.value = "";
    }
    loadingEl.style.display = "none";
    topicBadge.style.display = "block";
    experienceEl.style.display = "block";
    experienceEl.scrollIntoView({ behavior: "smooth", block: "start" });
    simFrame.srcdoc = result.labHtml;
  }

  function showError(msg) {
    loadingEl.style.display = "none";
    heroSection.style.display = "block";
    renderDashboard();
    errorMessage.textContent = msg;
    errorBox.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderQuiz(reflection) {
    quizOptions.innerHTML = "";
    const options = reflection.options || [];
    const correct = reflection.correct || "";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "quiz-option";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        quizOptions.querySelectorAll(".quiz-option").forEach(b => b.disabled = true);
        const isCorrect = opt === correct;
        btn.classList.add(isCorrect ? "correct-pick" : "wrong-pick");
        if (!isCorrect) {
          quizOptions.querySelectorAll(".quiz-option").forEach(b => {
            if (b.textContent === correct) b.classList.add("reveal-correct");
          });
        }
        feedbackPrefix.textContent = isCorrect ? "✓ Correct" : "Not quite";
        feedbackText.textContent = reflection.explanation || "";
        feedbackEl.className = "feedback " + (isCorrect ? "correct" : "wrong");
        feedbackEl.style.display = "block";
        if (currentPlan.realWorldPayoff) {
          payoffText.textContent = currentPlan.realWorldPayoff;
          payoffCard.style.display = "block";
        }
        againBtn.style.display = "block";
        onLabComplete(isCorrect);
      });
      quizOptions.appendChild(btn);
    });
  }

  // Level assessment state
  let _levelBackground = null;
  let _levelGoal = null;

  function showLevelModal(topic, onConfirm) {
    const modal = document.getElementById("levelModal");
    document.getElementById("levelTopicName").textContent = topic;
    _levelBackground = null; _levelGoal = null;
    modal.querySelectorAll(".level-opt").forEach(b => b.classList.remove("selected"));
    document.getElementById("levelGo").disabled = true;
    modal.classList.add("open");
    modal.querySelectorAll(".level-opt").forEach(btn => {
      btn.onclick = () => {
        const q = btn.dataset.q;
        modal.querySelectorAll(`.level-opt[data-q="${q}"]`).forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        if (q === "1") _levelBackground = btn.dataset.v;
        if (q === "2") _levelGoal = btn.dataset.v;
        document.getElementById("levelGo").disabled = !(_levelBackground && _levelGoal);
      };
    });
    document.getElementById("levelGo").onclick = () => {
      modal.classList.remove("open");
      onConfirm(_levelBackground, _levelGoal);
    };
  }

  function showProfilePanel() { /* stub — expand later */ alert("Profile & Settings coming soon!"); }
  function showSavedPanel() {
    heroSection.style.display = "block";
    document.getElementById("myLabsSection").scrollIntoView({ behavior: "smooth" });
    setSidebarActive("sidebarSaved");
  }
  function setSidebarActive(id) {
    document.querySelectorAll(".sidebar-item").forEach(el => el.classList.remove("active"));
    const el = document.getElementById(id);
    if (el) el.classList.add("active");
  }

  async function generate() {
    const topic = topicInput.value.trim();
    if (!topic) { topicInput.focus(); return; }
    // Show level check on fresh topics (not when re-generating same topic)
    if (topic !== lastTopic) {
      showLevelModal(topic, (bg, goal) => _doGenerate(topic, bg, goal));
      return;
    }
    _doGenerate(topic, _levelBackground, _levelGoal);
  }

  async function _doGenerate(topic, levelBackground, levelGoal) {
    lastTopic = topic;
    lastCategory = window._rependCat || (typeof RependGame !== "undefined" ? RependGame.inferCategory(topic) : "General");
    if (typeof RependGame !== "undefined") {
      RependGame.setLastSession(topic, lastCategory);
      const daily = RependGame.getDailyChallenge();
      if (topic.toLowerCase() === daily.topic.toLowerCase()) labFlags.isDaily = true;
    }
    labRewarded = false;
    if (generateAbort) generateAbort.abort();
    generateAbort = new AbortController();
    genBtn.disabled = true;
    errorBox.style.display = "none";
    heroSection.style.display = "none";
    document.getElementById("learnDashboard").style.display = "none";
    experienceEl.style.display = "none";
    topicBadge.style.display = "none";
    loadingEl.style.display = "block";
    resetStages();
    expandedTopicEl.style.display = "none";
    etTopic.textContent = "";
    etWhy.textContent = "";
    stageThinkText.textContent = `Reasoning about "${topic}"…`;
    setStage("expand");
    try {
      let result = await streamPlanLab(topic, lastCategory, generateAbort.signal, levelBackground, levelGoal);
      if (!result) {
        resetStages();
        setStage("expand");
        result = await streamPlanLab(topic, lastCategory, generateAbort.signal, levelBackground, levelGoal);
      }
      if (!result) throw new Error("No result received from server. Please try again.");
      showResult(result);
      LabLibrary.save(result, lastCategory);
      renderMyLabs();
      setSidebarActive("sidebarLearn");
    } catch (err) {
      if (err.name === "AbortError") return;
      showError(err.message || "Something went wrong");
    } finally {
      genBtn.disabled = false;
      generateAbort = null;
    }
  }

  async function checkAnswerText() {
    const answer = answerInput.value.trim();
    if (!answer || !currentPlan) return;
    checkBtn.disabled = true;
    checkBtn.textContent = "Checking…";
    feedbackEl.style.display = "none";
    try {
      const res = await fetch("/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          topic: currentPlan.topic,
          question: currentPlan.verificationQuestion,
          recipeSummary: currentPlan.learningGoal || "",
          userAnswer: answer,
          labResult: lastLabResult,
        }),
      });
      const data = await res.json();
      feedbackPrefix.textContent = data.correct ? "✓ Correct" : "Not quite";
      feedbackText.textContent = data.feedback;
      feedbackEl.className = "feedback " + (data.correct ? "correct" : "wrong");
      feedbackEl.style.display = "block";
      if (currentPlan.realWorldPayoff) {
        payoffText.textContent = currentPlan.realWorldPayoff;
        payoffCard.style.display = "block";
      }
      againBtn.style.display = "block";
      if (data.correct) onLabComplete(true);
    } catch (err) {
      feedbackPrefix.textContent = "Error";
      feedbackText.textContent = err.message;
      feedbackEl.className = "feedback wrong";
      feedbackEl.style.display = "block";
    } finally {
      checkBtn.disabled = false;
      checkBtn.textContent = "Check my answer";
    }
  }

  function reset() {
    experienceEl.style.display = "none";
    topicBadge.style.display = "none";
    errorBox.style.display = "none";
    heroSection.style.display = "block";
    document.getElementById("nextSteps").classList.remove("visible");
    labFlags = { isDaily: false, isReview: false };
    renderDashboard();
    renderMyLabs();
    topicInput.value = "";
    currentPlan = null;
    lastLabResult = null;
    simFrame.srcdoc = "";
    goalPill.classList.remove("visible");
    window.scrollTo({ top: 0, behavior: "smooth" });
    topicInput.focus();
  }
</script>

  function showModal(tab) {

  function switchTab(tab) {

  function setUser(user, token) {

  sb.auth.getSession().then(({ data: { session } }) => { if (session) setUser(session.user, session.access_token); });

  document.getElementById('btnLogin').onclick = () => showModal('signin');

    if (!currentPlan) return;

  // Save progress to Supabase when lab completes (in addition to localStorage via RependGame)

    const result = e.data.result || {};
    if (!result.ok) return;
    try {
      await fetch('/api/progress', {

          topic: currentPlan.topic,

          user_token: currentToken,
        }),
      });
    } catch (_) { /* non-critical */ }
  });
})();
