<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lab</title>
<style>
  :root {
    --bg: #0B1220;
    --panel: rgba(11,18,32,0.88);
    --border: rgba(59,130,246,0.25);
    --accent: #3B82F6;
    --copper: #D4A574;
    --good: #22C55E;
    --bad: #EF4444;
    --ink: #ffffff;
    --muted: rgba(255,255,255,0.65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; height: 100%; overflow: hidden; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  #header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); backdrop-filter: blur(8px);
  }
  #title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  #instructions { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.45; }
  #stageWrap {
    position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 16px;
  }
  #stage {
    max-width: 100%; max-height: 100%;
    background: #0E1830; border-radius: 12px;
    border: 1px solid var(--border);
    touch-action: none; user-select: none;
  }
  #controls {
    position: absolute; top: 28px; right: 28px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; backdrop-filter: blur(8px);
    min-width: 200px; max-width: 260px;
  }
  #controls h3 {
    font-size: 12px; font-weight: 600; color: var(--copper);
    letter-spacing: 0.8px; text-transform: uppercase; margin: 0 0 10px;
  }
  .slider-row { margin-bottom: 12px; }
  .slider-row label {
    display: flex; justify-content: space-between; font-size: 12px;
    color: var(--copper); letter-spacing: 0.5px; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .slider-row label span { color: var(--ink); font-size: 14px; letter-spacing: 0; text-transform: none; }
  .slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
  #footer {
    padding: 12px 20px; border-top: 1px solid var(--border);
    background: var(--panel); display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 9px 16px; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #feedback {
    margin-left: auto; font-size: 13px; padding: 8px 14px; border-radius: 8px;
    max-width: 60%;
  }
  #feedback.good { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4); color: #86EFAC; }
  #feedback.bad  { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #FCA5A5; }
  #progress { font-size: 12px; color: var(--muted); }
  .node-hit { cursor: pointer; }
  .draggable { cursor: grab; }
  .draggable.dragging { cursor: grabbing; opacity: 0.92; }
  .target { fill: rgba(59,130,246,0.06); stroke: rgba(59,130,246,0.5); stroke-dasharray: 4 4; }
  .target.hot { fill: rgba(59,130,246,0.18); }
  .target.filled { fill: rgba(34,197,94,0.10); stroke: rgba(34,197,94,0.5); stroke-dasharray: 0; }
  .label-static { fill: rgba(255,255,255,0.75); font-size: 12px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1 id="title">Lab</h1>
    <p id="instructions"></p>
  </div>
  <div id="stageWrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="controls" style="display:none">
      <h3>Controls</h3>
      <div id="sliders"></div>
    </div>
  </div>
  <div id="footer">
    <button id="checkBtn">Check answer</button>
    <button id="hintBtn" class="secondary">Hint</button>
    <button id="resetBtn" class="secondary">Reset</button>
    <span id="progress"></span>
    <div id="feedback" style="display:none"></div>
  </div>
</div>

<script>
// RECIPE is injected by the server as a JS object literal.
const RECIPE = /*__RECIPE__*/ { title: "Loading...", instructions: "", stage: {width:800,height:500}, background:{type:"svg",markup:""}, objects:[], winCondition:{type:"none"} } /*__END__*/;

(() => {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const stage = document.getElementById("stage");
  const sliders = document.getElementById("sliders");
  const controlsPanel = document.getElementById("controls");
  const titleEl = document.getElementById("title");
  const instructionsEl = document.getElementById("instructions");
  const checkBtn = document.getElementById("checkBtn");
  const hintBtn = document.getElementById("hintBtn");
  const resetBtn = document.getElementById("resetBtn");
  const feedbackEl = document.getElementById("feedback");
  const progressEl = document.getElementById("progress");

  // ---------- Recipe defaults ----------
  const W = (RECIPE.stage && RECIPE.stage.width)  || 900;
  const H = (RECIPE.stage && RECIPE.stage.height) || 540;
  stage.setAttribute("viewBox", `0 0 ${W} ${H}`);
  stage.setAttribute("width", W);
  stage.setAttribute("height", H);
  titleEl.textContent = RECIPE.title || "Lab";
  instructionsEl.textContent = RECIPE.instructions || "";

  // ---------- Background SVG ----------
  if (RECIPE.background && RECIPE.background.type === "svg" && RECIPE.background.markup) {
    const bg = document.createElementNS(SVG_NS, "g");
    bg.setAttribute("class", "bg");
    bg.innerHTML = RECIPE.background.markup;
    stage.appendChild(bg);
  }

  // ---------- State ----------
  const state = {};       // objectId -> current state/value/position
  const initial = {};     // snapshot for reset
  const nodes = {};       // objectId -> SVG element
  const draggables = [];  // {id, el, initialPos}
  const targets = [];     // {id, x, y, w, h, accepts, currentlyHolds: null|id}
  const sliderRefs = {};  // id -> input element

  // ---------- Build objects ----------
  (RECIPE.objects || []).forEach((obj) => {
    if (obj.kind === "node") buildNode(obj);
    else if (obj.kind === "draggable") buildDraggable(obj);
    else if (obj.kind === "target") buildTarget(obj);
    else if (obj.kind === "slider") buildSlider(obj);
    else if (obj.kind === "label") buildLabel(obj);
  });

  function buildLabel(obj) {
    const t = document.createElementNS(SVG_NS, "text");
    t.setAttribute("x", obj.x); t.setAttribute("y", obj.y);
    t.setAttribute("class", "label-static");
    if (obj.size) t.setAttribute("font-size", obj.size);
    if (obj.anchor) t.setAttribute("text-anchor", obj.anchor);
    if (obj.color) t.setAttribute("fill", obj.color);
    t.textContent = obj.text || "";
    stage.appendChild(t);
  }

  function buildNode(obj) {
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", "node-hit");
    g.setAttribute("transform", `translate(${obj.x},${obj.y})`);
    const size = obj.size || 32;
    let shapeEl;
    if (obj.shape === "circle") {
      shapeEl = document.createElementNS(SVG_NS, "circle");
      shapeEl.setAttribute("r", size / 2);
    } else {
      shapeEl = document.createElementNS(SVG_NS, "rect");
      shapeEl.setAttribute("x", -size / 2); shapeEl.setAttribute("y", -size / 2);
      shapeEl.setAttribute("width", size); shapeEl.setAttribute("height", size);
    }
    shapeEl.setAttribute("stroke-width", "2");
    g.appendChild(shapeEl);

    if (obj.label) {
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("y", size / 2 + 14); t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "label-static");
      t.textContent = obj.label;
      g.appendChild(t);
    }

    stage.appendChild(g);
    nodes[obj.id] = { el: g, shape: shapeEl, def: obj };
    state[obj.id]   = obj.initial || (obj.states && obj.states[0]) || "default";
    initial[obj.id] = state[obj.id];
    paintNode(obj.id);

    g.addEventListener("click", () => {
      const states = obj.states || ["off", "on"];
      const idx = states.indexOf(state[obj.id]);
      state[obj.id] = states[(idx + 1) % states.length];
      paintNode(obj.id);
      updateProgress();
    });
  }

  function paintNode(id) {
    const n = nodes[id]; if (!n) return;
    const styleMap = (n.def.stateStyles) || {};
    const fallback = {
      unaffected: { fill: "transparent",       stroke: "#ffffff" },
      affected:   { fill: "#3B82F6",           stroke: "#3B82F6" },
      carrier:    { fill: "rgba(59,130,246,0.45)", stroke: "#3B82F6" },
      off:        { fill: "transparent",       stroke: "#ffffff" },
      on:         { fill: "#3B82F6",           stroke: "#3B82F6" },
      male:       { fill: "#60A5FA",           stroke: "#60A5FA" },
      female:     { fill: "#F472B6",           stroke: "#F472B6" },
      default:    { fill: "transparent",       stroke: "#ffffff" },
    };
    const s = state[id];
    const st = styleMap[s] || fallback[s] || fallback.default;
    n.shape.setAttribute("fill", st.fill);
    n.shape.setAttribute("stroke", st.stroke);
  }

  function buildDraggable(obj) {
    const g = document.createElementNS(SVG_NS, "g");
    g.setAttribute("class", "draggable");
    g.setAttribute("transform", `translate(${obj.x},${obj.y})`);
    const w = obj.width || 120, h = obj.height || 36;
    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("x", -w/2); rect.setAttribute("y", -h/2);
    rect.setAttribute("width", w); rect.setAttribute("height", h);
    rect.setAttribute("rx", 8);
    rect.setAttribute("fill", obj.color || "#1E3A8A");
    rect.setAttribute("stroke", "#3B82F6"); rect.setAttribute("stroke-width", "1.5");
    g.appendChild(rect);
    const t = document.createElementNS(SVG_NS, "text");
    t.setAttribute("text-anchor", "middle"); t.setAttribute("dy", "0.35em");
    t.setAttribute("fill", "white"); t.setAttribute("font-size", "13");
    t.setAttribute("font-family", "system-ui, sans-serif");
    t.setAttribute("pointer-events", "none");
    t.textContent = obj.label || obj.id;
    g.appendChild(t);
    stage.appendChild(g);

    const entry = { id: obj.id, el: g, x: obj.x, y: obj.y, w, h, snappedTo: null, def: obj, initX: obj.x, initY: obj.y };
    draggables.push(entry);
    state[obj.id] = { x: obj.x, y: obj.y, snappedTo: null };
    initial[obj.id] = { x: obj.x, y: obj.y, snappedTo: null };

    let dragging = false, offset = {x:0, y:0};
    g.addEventListener("pointerdown", (e) => {
      dragging = true; g.classList.add("dragging");
      const pt = svgPoint(e);
      offset.x = pt.x - entry.x; offset.y = pt.y - entry.y;
      // detach from any target
      if (entry.snappedTo) {
        const tg = targets.find(t => t.id === entry.snappedTo);
        if (tg) tg.currentlyHolds = null;
        entry.snappedTo = null;
        state[obj.id].snappedTo = null;
      }
      stage.appendChild(g); // bring to front
      g.setPointerCapture(e.pointerId);
    });
    g.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const pt = svgPoint(e);
      entry.x = pt.x - offset.x; entry.y = pt.y - offset.y;
      g.setAttribute("transform", `translate(${entry.x},${entry.y})`);
      highlightHotTarget(entry);
    });
    g.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false; g.classList.remove("dragging");
      const hit = findTargetUnder(entry);
      targets.forEach(t => t.el.classList.remove("hot"));
      if (hit && (hit.accepts == null || hit.accepts.includes(entry.id))) {
        // snap
        entry.x = hit.x; entry.y = hit.y;
        g.setAttribute("transform", `translate(${entry.x},${entry.y})`);
        entry.snappedTo = hit.id;
        state[obj.id].x = entry.x; state[obj.id].y = entry.y; state[obj.id].snappedTo = hit.id;
        // if target already had something, swap it out
        if (hit.currentlyHolds && hit.currentlyHolds !== entry.id) {
          const prev = draggables.find(d => d.id === hit.currentlyHolds);
          if (prev) {
            prev.x = prev.initX; prev.y = prev.initY; prev.snappedTo = null;
            prev.el.setAttribute("transform", `translate(${prev.x},${prev.y})`);
            state[prev.id].x = prev.x; state[prev.id].y = prev.y; state[prev.id].snappedTo = null;
          }
        }
        hit.currentlyHolds = entry.id;
        hit.el.classList.add("filled");
      } else {
        state[obj.id].x = entry.x; state[obj.id].y = entry.y;
      }
      // unfill targets that lost their occupant
      targets.forEach(t => {
        if (!draggables.some(d => d.snappedTo === t.id)) {
          t.currentlyHolds = null;
          t.el.classList.remove("filled");
        }
      });
      updateProgress();
    });
  }

  function buildTarget(obj) {
    const w = obj.width || 130, h = obj.height || 40;
    const r = document.createElementNS(SVG_NS, "rect");
    r.setAttribute("x", obj.x - w/2); r.setAttribute("y", obj.y - h/2);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("rx", 8);
    r.setAttribute("class", "target");
    stage.appendChild(r);
    if (obj.label) {
      const t = document.createElementNS(SVG_NS, "text");
      t.setAttribute("x", obj.x); t.setAttribute("y", obj.y + h/2 + 14);
      t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "label-static");
      t.textContent = obj.label;
      stage.appendChild(t);
    }
    targets.push({ id: obj.id, x: obj.x, y: obj.y, w, h, el: r, accepts: obj.accepts || null, currentlyHolds: null });
  }

  function buildSlider(obj) {
    controlsPanel.style.display = "block";
    const row = document.createElement("div");
    row.className = "slider-row";
    const lbl = document.createElement("label");
    const txt = document.createElement("span");
    lbl.textContent = obj.label || obj.id;
    lbl.appendChild(txt);
    const input = document.createElement("input");
    input.type = "range";
    input.min = obj.min ?? 0; input.max = obj.max ?? 100;
    input.step = obj.step ?? 1; input.value = obj.initial ?? obj.min ?? 0;
    txt.textContent = formatVal(input.value, obj.unit);
    state[obj.id] = Number(input.value);
    initial[obj.id] = Number(input.value);
    input.addEventListener("input", () => {
      state[obj.id] = Number(input.value);
      txt.textContent = formatVal(input.value, obj.unit);
      // re-render bound svg attributes if any
      if (obj.bind) applyBind(obj.bind, state[obj.id]);
      updateProgress();
    });
    row.appendChild(lbl); row.appendChild(input);
    sliders.appendChild(row);
    sliderRefs[obj.id] = input;
    if (obj.bind) applyBind(obj.bind, state[obj.id]);
  }

  function applyBind(bind, value) {
    // bind = { selector: "#someId", attr: "r", scale: 1, offset: 0 }
    const el = stage.querySelector(bind.selector);
    if (!el) return;
    const v = (Number(value) * (bind.scale ?? 1)) + (bind.offset ?? 0);
    el.setAttribute(bind.attr || "r", v);
  }

  function formatVal(v, unit) { return unit ? `${v} ${unit}` : `${v}`; }

  function svgPoint(evt) {
    const pt = stage.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(stage.getScreenCTM().inverse());
  }
  function findTargetUnder(entry) {
    return targets.find(t => Math.abs(entry.x - t.x) < t.w/2 && Math.abs(entry.y - t.y) < t.h/2);
  }
  function highlightHotTarget(entry) {
    targets.forEach(t => t.el.classList.remove("hot"));
    const hit = findTargetUnder(entry);
    if (hit && (hit.accepts == null || hit.accepts.includes(entry.id))) hit.el.classList.add("hot");
  }

  // ---------- Win condition ----------
  function evaluate() {
    const wc = RECIPE.winCondition || { type: "none" };
    if (wc.type === "none") return { ok: true, score: 1, total: 1, wrong: [] };

    if (wc.type === "states-match") {
      const target = wc.target || {};
      const keys = Object.keys(target);
      let correct = 0; const wrong = [];
      keys.forEach(k => {
        if (state[k] === target[k]) correct++;
        else wrong.push({ id: k, expected: target[k], got: state[k] });
      });
      return { ok: correct === keys.length, score: correct, total: keys.length, wrong };
    }

    if (wc.type === "snaps-correct") {
      const target = wc.target || {};   // { draggableId: targetId }
      const keys = Object.keys(target);
      let correct = 0; const wrong = [];
      keys.forEach(k => {
        const s = state[k];
        if (s && s.snappedTo === target[k]) correct++;
        else wrong.push({ id: k, expected: target[k], got: s && s.snappedTo });
      });
      return { ok: correct === keys.length, score: correct, total: keys.length, wrong };
    }

    if (wc.type === "values-equal") {
      const target = wc.target || {};
      const tol = wc.tolerance ?? 0.0001;
      const keys = Object.keys(target);
      let correct = 0; const wrong = [];
      keys.forEach(k => {
        if (Math.abs(Number(state[k]) - Number(target[k])) <= tol) correct++;
        else wrong.push({ id: k, expected: target[k], got: state[k] });
      });
      return { ok: correct === keys.length, score: correct, total: keys.length, wrong };
    }

    return { ok: false, score: 0, total: 1, wrong: [] };
  }

  function updateProgress() {
    const r = evaluate();
    if (r.total > 1) progressEl.textContent = `Progress: ${r.score} / ${r.total}`;
    else progressEl.textContent = "";
  }
  updateProgress();

  // ---------- Buttons ----------
  resetBtn.addEventListener("click", () => {
    Object.keys(initial).forEach(k => {
      const init = initial[k];
      if (typeof init === "object" && init && "x" in init) {
        state[k] = { x: init.x, y: init.y, snappedTo: null };
        const d = draggables.find(x => x.id === k);
        if (d) { d.x = init.x; d.y = init.y; d.snappedTo = null;
          d.el.setAttribute("transform", `translate(${d.x},${d.y})`); }
      } else if (typeof init === "number") {
        state[k] = init;
        if (sliderRefs[k]) sliderRefs[k].value = init;
      } else {
        state[k] = init;
      }
    });
    targets.forEach(t => { t.currentlyHolds = null; t.el.classList.remove("filled"); t.el.classList.remove("hot"); });
    Object.keys(nodes).forEach(paintNode);
    feedbackEl.style.display = "none";
    updateProgress();
  });

  hintBtn.addEventListener("click", () => {
    feedbackEl.textContent = RECIPE.hint || "Re-read the scenario and look for the constraint it describes.";
    feedbackEl.className = "";
    feedbackEl.style.display = "block";
    feedbackEl.style.background = "rgba(212,165,116,0.10)";
    feedbackEl.style.border = "1px solid rgba(212,165,116,0.4)";
    feedbackEl.style.color = "#FCD9A6";
    feedbackEl.style.padding = "8px 14px";
    feedbackEl.style.borderRadius = "8px";
  });

  checkBtn.addEventListener("click", async () => {
    const r = evaluate();
    feedbackEl.className = r.ok ? "good" : "bad";
    feedbackEl.style.display = "block";
    feedbackEl.removeAttribute("style");
    feedbackEl.className = r.ok ? "good" : "bad";
    feedbackEl.style.display = "block";
    if (r.ok) {
      feedbackEl.textContent = (RECIPE.successMessage || "Correct! ") + " " + (RECIPE.insight || "");
    } else {
      const detail = (r.wrong || []).slice(0, 3).map(w => `${w.id}: expected ${JSON.stringify(w.expected)}`).join("; ");
      feedbackEl.textContent = `Not yet (${r.score}/${r.total}). ${detail}`;
    }
    // Tell parent (so it can run GPT-4o follow-up if it wants)
    parent.postMessage({ type: "labCheck", result: r, recipe: { title: RECIPE.title, winCondition: RECIPE.winCondition }, state }, "*");
  });
})();
</script>
</body>
</html>
